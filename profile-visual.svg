<text x="72" y="332" class="sans" font-size="14" fill="#C9D1D9">Open to ambitious products and collaborations</text>
<text x="1060" y="296" class="mono" font-size="78" font-weight="700" fill="#C4B5FD" opacity=".13">&lt;/&gt;</text>

