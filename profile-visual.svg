<rect x="138" y="514" width="80" height="24" rx="5" fill="#211A3D" stroke="#6D3DD5"/><text x="150" y="530" class="mono" font-size="11" fill="#C4B5FD">TypeScript</text>
<rect x="228" y="514" width="69" height="24" rx="5" fill="#211A3D" stroke="#6D3DD5"/><text x="241" y="530" class="mono" font-size="11" fill="#C4B5FD">Telegram</text>
<rect x="307" y="514" width="62" height="24" rx="5" fill="#211A3D" stroke="#6D3DD5"/><text x="320" y="530" class="mono" font-size="11" fill="#C4B5FD">Docker</text>

<rect x="48" y="552" width="1104" height="116" rx="10" fill="#161B22" stroke="#176B7B" stroke-width="2"/>
