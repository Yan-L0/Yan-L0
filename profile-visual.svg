<text x="48" y="108" class="mono" font-size="15" font-weight="700" letter-spacing="3" fill="#A78BFA">FRONTEND · FULL-STACK · PRODUCT</text>
<text x="48" y="170" class="sans" font-size="48" font-weight="750" letter-spacing="-2" fill="url(#title)">I build digital products</text>
<text x="48" y="222" class="sans" font-size="48" font-weight="750" letter-spacing="-2" fill="url(#title)">from interface to infrastructure.</text>
<text x="48" y="268" class="sans" font-size="17" fill="#AEB7C4">Responsive web experiences, reliable integrations and thoughtful product</text>
<text x="48" y="294" class="sans" font-size="17" fill="#AEB7C4">engineering — with a growing focus on backend, DevOps and AI.</text>
