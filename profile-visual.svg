<text x="72" y="612" class="sans" font-size="24" font-weight="700" fill="#F0F6FC">Vape Bazar</text>
<text x="72" y="637" class="sans" font-size="14" fill="#8B949E">Full-stack storefront with a product catalog, responsive UX and supporting application services.</text>
<rect x="72" y="646" width="56" height="24" rx="5" fill="#142B35" stroke="#176B7B"/><text x="84" y="662" class="mono" font-size="11" fill="#A5F3FC">React</text>
